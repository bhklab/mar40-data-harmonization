# ============================================================
# MAR-40 | Example 1: ICB_Hwang (GSE136961)
# Clinical + RNA Harmonization
# ============================================================

hwang:

  # ----------------------------------------------------------
  # 1. Data directories
  # ----------------------------------------------------------

  data_root: "data/examples/icb_hwang"

  download_dir: "data/examples/icb_hwang/download"
  curation_dir: "data/examples/icb_hwang/curation"
  annotation_dir: "data/examples/icb_hwang/annot"

  # ----------------------------------------------------------
  # 2. Annotation files
  # ----------------------------------------------------------

  annotation_file: "data/examples/icb_hwang/annot/Gencode.v19.annotation.RData"
  tissue_annotation_file: "data/examples/icb_hwang/annot/curation_tissue.csv"

  # ----------------------------------------------------------
  # 3. Dataset information
  # ----------------------------------------------------------

  geo_accession: "GSE136961"

  # ----------------------------------------------------------
  # 4. RNA expression processing
  # ----------------------------------------------------------

  expression_unit: "TPM"
  expression_transform: "log2(TPM + 1)"

  # ----------------------------------------------------------
  # 5. R executable (Windows R 4.5.2)
  # ----------------------------------------------------------

  # Local Windows configuration.
  # Linux/HPC users should replace this with their Rscript path.

  rscript: "C:/Program Files/R/R-4.5.2/bin/x64/Rscript.exe"

  # ----------------------------------------------------------
  # 6. Final output
  # ----------------------------------------------------------

  mae_file: "data/examples/icb_hwang/curation/ICB_Hwang.rds"